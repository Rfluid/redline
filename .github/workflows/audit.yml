name: audit

# cargo-deny (deny.toml): RustSec advisories, licenses, banned crates and sources.
# Daily too, because new advisories land without any change here.
on:
  pull_request:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock, deny.toml, .github/workflows/audit.yml]
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock, deny.toml, .github/workflows/audit.yml]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    name: cargo-deny ${{ matrix.checks }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    # A new advisory shouldn't block an unrelated PR; it still fails on main and on the daily run.
    continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
