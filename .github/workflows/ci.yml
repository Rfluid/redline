name: ci

# Pull requests to main must pass this. release.yml calls it too, so a tag only ships if its commit passes.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # workflow_call runs share the caller's ref; keep them out of the PR/push group.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt · clippy · js syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal -c rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: extractions/setup-just@v4
      - name: Cargo.lock is up to date
        run: cargo fetch --locked
      - run: just lint
      - name: Release scripts parse
        run: bash -n scripts/*.sh bin/redline
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem bin/*.ps1, scripts/*.ps1) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
            foreach ($e in $errs) { Write-Output "::error file=$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }

  test:
    name: build · test · e2e · browser (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS: dirs::state_dir() is None there, so the ~/.local/state fallback and BSD userland get exercised.
        # Windows: junctions, CLI shims, bin/redline.ps1 (e2e runs it through Git Bash), taskkill.
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: extractions/setup-just@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y jq
      - if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command jq -ErrorAction SilentlyContinue)) { choco install jq -y --no-progress }
      - name: Build
        run: cargo build --locked --all-targets
      - run: just test
      - run: just e2e
      - run: just browser
